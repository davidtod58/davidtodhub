<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>David Tod Hub · official links</title>
  <!-- SEO & accessibility -->
  <meta name="description" content="David Tod Hub links. Join our verified community for daily correct score, football tips, and match updates.">
  <link rel="canonical" href="https://davidtodhub.com">
  <!-- Font & icons (Font Awesome for modern icons) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <!-- style.css will be injected below, but we keep it clean -->
  <style>
    /* ----- style.css (embedded for MVP) ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0b0b0b;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      padding: 20px;
      color: #f5f5f5;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .glass-card {
      max-width: 480px;
      width: 100%;
      margin: 0 auto;
      background: rgba(20, 20, 20, 0.55);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 32px;
      padding: 32px 24px 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.03);
      transition: all 0.2s ease;
      animation: fadeUp 0.7s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
    }

    @keyframes fadeUp {
      0% { opacity: 0; transform: translateY(24px) scale(0.97); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* header */
    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
      font-size: 0.7rem;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      color: #b0b0b0;
      font-weight: 500;
    }
    .header-left {
      background: rgb(15, 70, 81);
      padding: 6px 12px 6px 10px;
      border-radius: 40px;
      border: 0.5px solid rgba(255,255,255,0.04);
    }
    .badge-18 {
      background: rgba(255, 215, 0, 0.08);
      border: 0.5px solid rgba(255, 215, 0, 0.15);
      color: #f0d078;
      padding: 4px 12px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 0.75rem;
      letter-spacing: 0.5px;
      backdrop-filter: blur(4px);
    }

    /* logo */
    .logo-wrapper {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }
    .logo-d {
      width: 88px;
      height: 88px;
      background: #1c1c1c;
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.6rem;
      font-weight: 700;
      color: white;
      box-shadow: 0 15px 30px -8px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.04);
      transition: transform 0.2s ease;
      letter-spacing: -2px;
      font-family: 'Inter', system-ui, sans-serif;
    }
    .logo-d span {
      transform: translateY(-2px);
    }

    /* typography */
    .main-title {
      font-size: 2.2rem;
      font-weight: 700;
      text-align: center;
      letter-spacing: -0.5px;
      margin-top: 8px;
      margin-bottom: 4px;
      color: #fff;
      line-height: 1.2;
    }
    .sub-desc {
      text-align: center;
      color: #b8b8b8;
      font-size: 0.95rem;
      max-width: 320px;
      margin: 8px auto 22px;
      font-weight: 400;
      letter-spacing: 0.2px;
      padding: 0 4px;
    }

    /* buttons */
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin: 20px 0 28px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 18px 22px;
      border-radius: 60px;
      font-weight: 600;
      font-size: 1.05rem;
      border: none;
      text-decoration: none;
      transition: all 0.2s cubic-bezier(0.2, 0.9, 0.4, 1);
      width: 100%;
      cursor: pointer;
      background: #2a2a2a;
      color: #f0f0f0;
      box-shadow: 0 6px 14px rgba(0,0,0,0.4);
      letter-spacing: 0.2px;
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(2px);
    }

    .btn-primary {
      background: #25D366;
      color: #0b0b0b;
      box-shadow: 0 6px 18px rgba(37, 211, 102, 0.2);
    }
    .btn-primary i {
      color: #0b0b0b;
    }
    .btn-primary:hover {
      background: #2bdd70;
      box-shadow: 0 8px 28px rgba(37, 211, 102, 0.35);
      transform: scale(1.01) translateY(-2px);
    }
    .btn-primary:active {
      transform: scale(0.97);
      box-shadow: 0 3px 12px rgba(37, 211, 102, 0.4);
    }

    .btn-secondary {
      background: rgba(40, 40, 40, 0.8);
      backdrop-filter: blur(4px);
      border: 0.5px solid rgba(255,255,255,0.06);
      color: #f0f0f0;
      box-shadow: 0 6px 18px rgba(0,0,0,0.5);
    }
    .btn-secondary i {
      color: #7aa2f7;
    }
    .btn-secondary:hover {
      background: rgba(60, 60, 60, 0.9);
      box-shadow: 0 8px 28px rgba(100, 140, 255, 0.15);
      transform: scale(1.01) translateY(-2px);
      border-color: rgba(255,255,255,0.1);
    }
    .btn-secondary:active {
      transform: scale(0.97);
    }

    .btn i {
      font-size: 1.3rem;
      width: 1.6rem;
      text-align: center;
      transition: transform 0.2s;
    }
    .btn:hover i {
      transform: translateX(3px);
    }

    /* footer */
    .footer-links {
      display: flex;
      justify-content: center;
      gap: 28px;
      flex-wrap: wrap;
      margin: 24px 0 14px;
    }
    .footer-links a {
      color: #9a9a9a;
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 450;
      letter-spacing: 0.2px;
      transition: color 0.2s;
      border-bottom: 1px solid transparent;
    }
    .footer-links a:hover {
      color: #eaeaea;
      border-bottom-color: rgba(255,255,255,0.1);
    }

    .footer-copy {
      text-align: center;
      color: #5a5a5a;
      font-size: 0.7rem;
      letter-spacing: 0.3px;
      margin-top: 12px;
      font-weight: 350;
    }

    /* responsive */
    @media (max-width: 420px) {
      .glass-card { padding: 24px 18px 22px; }
      .main-title { font-size: 1.9rem; }
      .logo-d { width: 74px; height: 74px; font-size: 3rem; border-radius: 24px; }
      .btn { font-size: 0.95rem; padding: 16px 18px; }
      .header-left { font-size: 0.6rem; }
    }
    @media (min-width: 600px) {
      .glass-card { padding: 40px 36px 32px; }
      .main-title { font-size: 2.8rem; }
      .logo-d { width: 100px; height: 100px; font-size: 4.2rem; border-radius: 32px; }
    }

    /* smooth glow (subtle) */
    .btn-primary::after {
      content: '';
      position: absolute;
      top: -20%;
      left: -10%;
      width: 120%;
      height: 140%;
      background: radial-gradient(circle at 30% 40%, rgba(255,255,255,0.2), transparent 70%);
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }
    .btn-primary:hover::after {
      opacity: 0.3;
    }
    .btn-secondary::after {
      content: '';
      position: absolute;
      top: -20%;
      left: -10%;
      width: 120%;
      height: 140%;
      background: radial-gradient(circle at 70% 30%, rgba(140, 180, 255, 0.08), transparent 70%);
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }
    .btn-secondary:hover::after {
      opacity: 0.4;
    }

    /* accessibility focus */
    .btn:focus-visible {
      outline: 2px solid #b0b0ff;
      outline-offset: 4px;
    }
    a:focus-visible {
      outline: 2px solid #b0b0ff;
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <div class="glass-card" role="main">
    <!-- header -->
    <div class="header-row">
      <span class="header-left"><i class="fas fa-shield-alt" style="margin-right: 6px;color: #e408b4e7;opacity:0.6;"></i> DAVID TOD HUB</span>
      <span class="badge-18" aria-label="age restriction 18+">18+</span>
    </div>

    <!-- logo D -->
    <div class="logo-wrapper">
      <div class="logo-d" aria-hidden="true">
  <img src="thambmail.jpg" alt="David Tod Hub logo" style="width: 70%; height: auto; border-radius: 12px;">
</div>
    </div>

    <!-- title & desc -->
    <h1 class="main-title">David Tod Hub</h1>
    <p class="sub-desc">The official David Tod Hub links. Join our verified community for daily correct score predictions, football tips, and match updates.</p>

    <!-- buttons -->
    <div class="btn-group">
      <!-- 1. WhatsApp (primary) -->
      <a href="https://chat.whatsapp.com/I6XbhSYirEp997UbQlN1gS" 
         target="_blank" 
         rel="noopener noreferrer" 
         class="btn btn-primary" 
         aria-label="Join WhatsApp Group">
        <i class="fab fa-whatsapp"></i> Join WhatsApp Group
      </a>
      <!-- 2. Telegram (secondary) -->
      <a href="https://t.me/+Zpv3Y5bk2uY4NTg0" 
         target="_blank" 
         rel="noopener noreferrer" 
         class="btn btn-secondary" 
         aria-label="Join Telegram Channel">
        <i class="fab fa-telegram-plane"></i> Join Telegram Channel
      </a>
    </div>

    <!-- footer links + copyright -->
    <div class="footer-links">
      <a href="https://chat.whatsapp.com/I6XbhSYirEp997UbQlN1gS" target="_blank" rel="noopener noreferrer">WhatsApp Group</a>
      <a href="https://t.me/+Zpv3Y5bk2uY4NTg0" target="_blank" rel="noopener noreferrer">Telegram Channel</a>
    </div>
    <div class="footer-copy">
      © 2026 David Tod Hub. All rights reserved.
    </div>
  </div>

  <!-- script.js (vanilla, minimal) -->
  <script>
    (function() {
      // Ensure all external links open in new tab with security (already set via rel)
      // subtle hover/tap enhancements via CSS, but we add a tiny tap feedback for mobile
      const buttons = document.querySelectorAll('.btn');
      if ('ontouchstart' in window) {
        buttons.forEach(btn => {
          btn.addEventListener('touchstart', function() {
            this.style.transition = 'transform 0.08s';
            this.style.transform = 'scale(0.96)';
          }, { passive: true });
          btn.addEventListener('touchend', function() {
            this.style.transform = '';
          }, { passive: true });
        });
      }

      // optional: log that page is ready (no analytics, no cookies)
      console.log('David Tod Hub · official page loaded');
    })();
  </script>

  <!-- All code is separated conceptually: style in <style>, script above, HTML structure clean -->
  <!-- Everything in one file for MVP, but clearly separated per requirement -->
</body>
</html>
